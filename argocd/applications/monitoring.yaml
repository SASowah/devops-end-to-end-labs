apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack-new
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 45.7.1
    helm:
      values: |
        fullnameOverride: "prometheus"
        grafana:
          enabled: true
          adminUser: admin
          adminPassword: admin
          service:
            type: ClusterIP
        prometheus:
          service:
            type: ClusterIP
        prometheusOperator:
          # Fix the TLS issue by disabling TLS
          tls:
            enabled: false
          # Completely disable admission webhooks
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
          # Disable the web.enable-tls flag
          args:
            - --kubelet-service=kube-system/prometheus-kubelet
            - --localhost=127.0.0.1
            - --web.enable-tls=false
            - --web.listen-address=:8080
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - Force=true
