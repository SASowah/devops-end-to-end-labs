apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-backend
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: https://github.com/SASowah/devops-end-to-end-labs.git
    targetRevision: HEAD
    path: helm/backend
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
