<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEEYIT SOLUTIONS Chat Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      /* Light theme variables */
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --secondary: #0ea5e9;
      --light: #f3f4f6;
      --dark: #1f2937;
      --success: #10b981;
      --danger: #ef4444;
      --gray: #9ca3af;
      --bg-gradient: linear-gradient(135deg, #f6f7ff 0%, #e9eeff 100%);
      --container-bg: white;
      --message-bg: white;
      --message-received-bg: #f3f4f6;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --input-bg: white;
      --modal-bg: white;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #0ea5e9;
      --light: #1f2937;
      --dark: #f3f4f6;
      --success: #10b981;
      --danger: #ef4444;
      --gray: #9ca3af;
      --bg-gradient: linear-gradient(135deg, #1a1b1e 0%, #2d3748 100%);
      --container-bg: #1f2937;
      --message-bg: #374151;
      --message-received-bg: #4b5563;
      --text-primary: #f3f4f6;
      --text-secondary: #d1d5db;
      --border-color: #4b5563;
      --input-bg: #374151;
      --modal-bg: #1f2937;
      --shadow-color: rgba(0, 0, 0, 0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease;
    }

    /* Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--container-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      box-shadow: 0 2px 10px var(--shadow-color);
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }

    /* Username Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: var(--modal-bg);
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px var(--shadow-color);
      border: 1px solid var(--border-color);
    }

    .modal-content h2 {
      color: var(--primary);
      margin-bottom: 1rem;
      text-align: center;
    }

    .username-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .username-input {
      padding: 0.8rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
      background: var(--input-bg);
      color: var(--text-primary);
    }

    .username-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .join-button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .join-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .join-button:active {
      transform: translateY(0);
    }
    
    .chat-container {
      max-width: 1000px;
      margin: 2rem auto;
      background: var(--container-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px var(--shadow-color);
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      border: 1px solid var(--border-color);
    }

    .chat-container.active {
      opacity: 1;
      transform: translateY(0);
    }
    
    .chat-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 12px 12px 0 0;
    }
    
    .chat-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-weight: 600;
    }
    
    .online-indicator {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
    
    .online-dot {
      height: 10px;
      width: 10px;
      background-color: var(--success);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.5; transform: scale(0.8); }
    }
    
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-gradient);
    }
    
    .message-list {
      list-style-type: none;
      width: 100%;
    }
    
    .message {
      margin-bottom: 1rem;
      padding: 1rem 1.2rem;
      border-radius: 18px;
      max-width: 80%;
      position: relative;
      animation: fadeIn 0.3s ease-out;
      word-wrap: break-word;
      box-shadow: 0 2px 5px var(--shadow-color);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.received {
      background-color: var(--message-received-bg);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    
    .message.sent {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    
    .message-time {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      text-align: right;
    }
    
    .message.sent .message-time {
      color: rgba(255, 255, 255, 0.8);
    }
    
    .input-area {
      display: flex;
      padding: 1rem;
      background: var(--container-bg);
      border-top: 1px solid var(--border-color);
      gap: 0.8rem;
    }
    
    .message-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 2px solid var(--border-color);
      border-radius: 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
      background: var(--input-bg);
      color: var(--text-primary);
    }
    
    .message-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .send-button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .send-button:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }
    
    .send-button:active {
      transform: scale(0.95);
    }
    
    .typing-indicator {
      padding: 0.5rem 1rem;
      color: var(--text-secondary);
      font-style: italic;
      font-size: 0.9rem;
      visibility: hidden;
      transition: visibility 0.3s;
    }
    
    .typing-indicator.active {
      visibility: visible;
    }
    
    .user-info {
      font-weight: 500;
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
      color: var(--primary);
    }

    .system-message {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin: 1rem 0;
      padding: 0.5rem;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }

    /* Scrollbar Styling */
    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .messages-container::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }
    
    @media (max-width: 768px) {
      .chat-container {
        margin: 0;
        border-radius: 0;
        height: 100vh;
      }
      
      .chat-header {
        border-radius: 0;
      }
      
      .message {
        max-width: 90%;
      }

      .modal-content {
        width: 95%;
        margin: 1rem;
      }

      .theme-toggle {
        top: 0.5rem;
        right: 0.5rem;
      }
    }

    /* Message Status Icons */
    .message-status {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 0.7rem;
      margin-left: 4px;
      color: var(--text-secondary);
    }

    .message-status i {
      font-size: 0.8rem;
    }

    .message-status.read i {
      color: var(--primary);
    }

    /* Message Reactions */
    .message-reactions {
      position: absolute;
      bottom: -20px;
      right: 0;
      display: flex;
      gap: 2px;
      background: var(--container-bg);
      padding: 2px 6px;
      border-radius: 12px;
      box-shadow: 0 2px 4px var(--shadow-color);
      font-size: 0.8rem;
    }

    .reaction-button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px;
      transition: transform 0.2s;
    }

    .reaction-button:hover {
      transform: scale(1.2);
    }

    /* Message Grouping */
    .message-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 1rem;
    }

    .message-group .message {
      margin-bottom: 0;
    }

    .message-group .message:not(:last-child) {
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .message-group .message:not(:first-child) {
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }

    /* Message Menu */
    .message-menu {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--container-bg);
      border-radius: 8px;
      box-shadow: 0 2px 10px var(--shadow-color);
      padding: 0.5rem;
      display: none;
      z-index: 100;
    }

    .message-menu.active {
      display: block;
    }

    .message-menu-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      color: var(--text-primary);
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .message-menu-item:hover {
      background: var(--border-color);
    }

    /* Message Actions */
    .message-actions {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: -40px;
      display: none;
      gap: 4px;
    }

    .message:hover .message-actions {
      display: flex;
    }

    .message-action-button {
      background: var(--container-bg);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .message-action-button:hover {
      background: var(--primary);
      color: white;
    }

    /* Message Input Improvements */
    .input-area {
      position: relative;
    }

    .input-actions {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 0.5rem;
    }

    .input-action-button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .input-action-button:hover {
      background: var(--border-color);
      color: var(--primary);
    }

    .message-input {
      padding-left: 3rem;
    }

    /* Emoji Picker */
    .emoji-picker {
      position: absolute;
      bottom: 100%;
      left: 1rem;
      background: var(--container-bg);
      border-radius: 8px;
      box-shadow: 0 2px 10px var(--shadow-color);
      padding: 0.5rem;
      display: none;
      z-index: 100;
    }

    .emoji-picker.active {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.5rem;
    }

    .emoji-item {
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .emoji-item:hover {
      background: var(--border-color);
    }

    /* Message Time Tooltip */
    .message-time {
      position: relative;
    }

    .message-time:hover::after {
      content: attr(data-full-time);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--container-bg);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      white-space: nowrap;
      box-shadow: 0 2px 4px var(--shadow-color);
      z-index: 100;
    }
  </style>
</head>
<body>
  <!-- Theme Toggle Button -->
  <button id="theme-toggle" class="theme-toggle" title="Toggle Dark Mode">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Username Modal -->
  <div id="username-modal" class="modal-overlay">
    <div class="modal-content">
      <h2><i class="fas fa-user-circle"></i> Enter Your Name</h2>
      <form id="username-form" class="username-form">
        <input 
          type="text" 
          id="username-input" 
          class="username-input" 
          placeholder="Enter your name" 
          required
          autocomplete="off"
        />
        <button type="submit" class="join-button">
          <i class="fas fa-sign-in-alt"></i> Join Chat
        </button>
      </form>
    </div>
  </div>

  <div id="chat-container" class="chat-container">
    <div class="chat-header">
      <h1><i class="fas fa-comments"></i> CEEYIT SOLUTIONS</h1>
      <div class="user-profile">
        <div class="user-avatar" id="user-avatar"></div>
        <span id="current-username">Guest</span>
      </div>
      <div class="online-indicator">
        <div class="online-dot"></div>
        <span>Online</span>
      </div>
    </div>
    
    <div class="messages-container">
      <ul id="messages" class="message-list"></ul>
    </div>
    
    <div id="typing-indicator" class="typing-indicator">Someone is typing...</div>
    
    <div class="input-area">
      <div class="input-actions">
        <button class="input-action-button" id="emoji-button" title="Add emoji">
          <i class="far fa-smile"></i>
        </button>
        <button class="input-action-button" id="attach-button" title="Attach file">
          <i class="fas fa-paperclip"></i>
        </button>
      </div>
      <div id="emoji-picker" class="emoji-picker"></div>
      <input 
        id="message-input" 
        class="message-input" 
        type="text" 
        placeholder="Type your message here..." 
        autocomplete="off"
      />
      <button id="send-button" class="send-button">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const socket = io();
      const messageInput = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');
      const messagesList = document.getElementById('messages');
      const typingIndicator = document.getElementById('typing-indicator');
      const usernameModal = document.getElementById('username-modal');
      const usernameForm = document.getElementById('username-form');
      const usernameInput = document.getElementById('username-input');
      const chatContainer = document.getElementById('chat-container');
      const userAvatar = document.getElementById('user-avatar');
      const currentUsername = document.getElementById('current-username');
      const themeToggle = document.getElementById('theme-toggle');
      
      let username = '';
      let typingTimeout;

      // Theme Toggle Functionality
      const setTheme = (isDark) => {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      };

      // Initialize theme from localStorage
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        setTheme(savedTheme === 'dark');
      } else {
        // Check system preference
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark);
      }

      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setTheme(!isDark);
      });
      
      // Function to format current time
      const formatTime = () => {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      // Function to get initials from username
      const getInitials = (name) => {
        return name
          .split(' ')
          .map(word => word[0])
          .join('')
          .toUpperCase()
          .slice(0, 2);
      };
      
      // Emoji picker setup
      const emojiButton = document.getElementById('emoji-button');
      const emojiPicker = document.getElementById('emoji-picker');
      const emojis = ['😊', '😂', '❤️', '👍', '🎉', '🔥', '👏', '🙌', '🤔', '😎', '😢', '😡', '👋', '💪', '🎯', '✨'];
      
      emojis.forEach(emoji => {
        const button = document.createElement('button');
        button.className = 'emoji-item';
        button.textContent = emoji;
        button.onclick = () => {
          messageInput.value += emoji;
          messageInput.focus();
        };
        emojiPicker.appendChild(button);
      });

      emojiButton.addEventListener('click', () => {
        emojiPicker.classList.toggle('active');
      });

      // Close emoji picker when clicking outside
      document.addEventListener('click', (e) => {
        if (!emojiButton.contains(e.target) && !emojiPicker.contains(e.target)) {
          emojiPicker.classList.remove('active');
        }
      });

      // Function to format full date and time
      const formatFullTime = () => {
        const now = new Date();
        return now.toLocaleString();
      };

      // Function to create and append a message
      const appendMessage = (content, isSent = false, user = null) => {
        const li = document.createElement('li');
        li.className = `message ${isSent ? 'sent' : 'received'}`;
        
        let messageContent = '';
        
        if (!isSent && user) {
          messageContent += `<div class="user-info">${user}</div>`;
        }
        
        const fullTime = formatFullTime();
        messageContent += `
          <div class="message-content">${content}</div>
          <div class="message-time" data-full-time="${fullTime}">${formatTime()}</div>
          ${isSent ? `
            <div class="message-status">
              <i class="fas fa-check-double"></i>
            </div>
          ` : ''}
          <div class="message-actions">
            <button class="message-action-button" title="React">
              <i class="far fa-smile"></i>
            </button>
            <button class="message-action-button" title="Reply">
              <i class="fas fa-reply"></i>
            </button>
            <button class="message-action-button" title="More">
              <i class="fas fa-ellipsis-v"></i>
            </button>
          </div>
        `;
        
        li.innerHTML = messageContent;
        messagesList.appendChild(li);
        
        // Add message menu
        const menu = document.createElement('div');
        menu.className = 'message-menu';
        menu.innerHTML = `
          <div class="message-menu-item">
            <i class="fas fa-reply"></i>
            Reply
          </div>
          <div class="message-menu-item">
            <i class="fas fa-forward"></i>
            Forward
          </div>
          <div class="message-menu-item">
            <i class="fas fa-copy"></i>
            Copy
          </div>
          <div class="message-menu-item">
            <i class="fas fa-trash"></i>
            Delete
          </div>
        `;
        li.appendChild(menu);

        // Add click handlers for message actions
        const moreButton = li.querySelector('.message-action-button:last-child');
        moreButton.addEventListener('click', (e) => {
          e.stopPropagation();
          menu.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!menu.contains(e.target) && !moreButton.contains(e.target)) {
            menu.classList.remove('active');
          }
        });

        // Scroll to the bottom
        const messagesContainer = document.querySelector('.messages-container');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Simulate message read status
        if (isSent) {
          setTimeout(() => {
            const status = li.querySelector('.message-status');
            status.innerHTML = '<i class="fas fa-check-double"></i>';
            status.classList.add('read');
          }, 2000);
        }
      };

      // Function to append system message
      const appendSystemMessage = (content) => {
        const li = document.createElement('li');
        li.className = 'system-message';
        li.textContent = content;
        messagesList.appendChild(li);
      };
      
      // Send message function
      const sendMessage = () => {
        const message = messageInput.value.trim();
        if (message !== '') {
          // Emit the message to the server
          socket.emit('chat message', {
            content: message,
            username: username
          });
          
          // Add the message to our UI
          appendMessage(message, true);
          
          // Clear the input
          messageInput.value = '';
          
          // Focus back on the input
          messageInput.focus();
          
          // Clear the typing indicator
          socket.emit('stop typing');
        }
      };

      // Handle username submission
      usernameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const inputUsername = usernameInput.value.trim();
        if (inputUsername) {
          username = inputUsername;
          currentUsername.textContent = username;
          userAvatar.textContent = getInitials(username);
          usernameModal.style.display = 'none';
          chatContainer.classList.add('active');
          messageInput.focus();
          
          // Announce this user has joined
          socket.emit('user joined', { username });
          
          // Welcome message
          appendSystemMessage('Welcome to CEEYIT SOLUTIONS Chat! Start chatting now.');
        }
      });
      
      // Event listeners
      sendButton.addEventListener('click', sendMessage);
      
      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        } else {
          // Emit typing event
          socket.emit('typing', username);
          
          // Clear the previous timeout
          clearTimeout(typingTimeout);
          
          // Set a new timeout
          typingTimeout = setTimeout(() => {
            socket.emit('stop typing');
          }, 2000);
        }
      });
      
      // Socket events
      socket.on('chat message', (data) => {
        if (data.username !== username) {
          appendMessage(data.content, false, data.username);
        }
      });
      
      socket.on('user joined', (data) => {
        if (data.username !== username) {
          appendSystemMessage(`${data.username} has joined the chat`);
        }
      });
      
      socket.on('typing', (data) => {
        if (data.username !== username) {
          typingIndicator.textContent = `${data.username} is typing...`;
          typingIndicator.classList.add('active');
        }
      });
      
      socket.on('stop typing', () => {
        typingIndicator.classList.remove('active');
      });

      // Handle file attachment
      const attachButton = document.getElementById('attach-button');
      attachButton.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*,video/*,audio/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            // Here you would typically upload the file and get a URL
            // For now, we'll just show a message
            appendMessage(`📎 Attached: ${file.name}`, true);
          }
        };
        input.click();
      });
    });
  </script>
</body>
</html>
