<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viraly • The Future of Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #7b61ff;
      --background: #f5f7fb;
      --message-bg: #ffffff;
      --sent-bg: #7b61ff;
      --sent-text: #ffffff;
      --received-bg: #eeeeee;
      --text: #2e2e2e;
      --bubble-radius: 20px;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: linear-gradient(to right, var(--primary), #5f4dee);
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      font-size: 1.25rem;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: var(--bubble-radius);
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    .sent {
      background-color: var(--sent-bg);
      color: var(--sent-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .received {
      background-color: var(--received-bg);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 0.5rem;
      background-color: #fff;
    }

    input {
      flex: 1;
      border: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border-radius: 30px;
      background-color: #f0f0f0;
      outline: none;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      margin-left: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    @media (max-width: 600px) {
      .message { max-width: 90%; }
      input { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <header>
    <i class="fas fa-bolt"></i> Viraly Chat
  </header>

  <div id="chat" class="chat-box"></div>

  <div class="input-area">
    <input id="message" type="text" placeholder="Send a message..." autocomplete="off"/>
    <button id="send"><i class="fas fa-paper-plane"></i></button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send');

    function appendMessage(content, isSent = false) {
      const div = document.createElement('div');
      div.classList.add('message', isSent ? 'sent' : 'received');
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;
      appendMessage(msg, true);
      socket.emit('chat message', msg);
      messageInput.value = '';
    }

    socket.on('chat message', (msg) => {
      appendMessage(msg, false);
    });
  </script>
</body>
</html>
