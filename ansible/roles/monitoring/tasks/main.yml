---
- name: Install dependencies
  apt:
    name:
      - wget
      - curl
      - software-properties-common
    state: present
    update_cache: yes

# --------------------------
# PROMETHEUS INSTALLATION
# --------------------------

- name: Add Prometheus user
  user:
    name: prometheus
    shell: /sbin/nologin

- name: Create Prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: 0755
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download and extract Prometheus
  unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v2.51.1/prometheus-2.51.1.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes

- name: Move Prometheus binaries
  copy:
    remote_src: yes
    src: "/tmp/prometheus-2.51.1.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: 0755
  loop:
    - prometheus
    - promtool

- name: Set permissions on Prometheus data directory
  file:
    path: /var/lib/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    recurse: yes

- name: Copy Prometheus config
  copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 5s

      scrape_configs:
        - job_name: 'nodejs_chat_app'
          static_configs:
            - targets: ['localhost:3000']


  notify: Restart Prometheus

- name: Create Prometheus systemd service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus Monitoring
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --web.listen-address="0.0.0.0:9090"

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Prometheus
  systemd:
    name: prometheus
    enabled: yes
    state: started

# --------------------------
# GRAFANA INSTALLATION
# --------------------------

- name: Add Grafana APT key
  apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Add Grafana APT repo
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    filename: grafana

- name: Install Grafana
  apt:
    name: grafana
    state: present
    update_cache: yes

- name: Configure Grafana to use port 3001
  lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_port *=.*'
    line: 'http_port = 3001'
  notify: Restart Grafana


- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: yes
    state: started

